<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css">
    <title>Quiz-app</title>
  </head>
  <body>
    <div class="container" id="start-screen">
      <div class="home-screen">
        <h1>Quiz app</h1>
        <p>test your knowledge</p>
      </div>
      <div class="form-group">
        <label>category:</label>
        <select class="box"  id="category">
          <option class="drop" value="9">General Knowledge</option>
          <option value="21">Sports</option>
          <option value="23">History</option>
          <option value="18">Computers</option>
          <option value="11">Movies</option>
        </select>
      </div>

      <div class="form-group">
        <label>difficulty:</label>
        <select class="box"  id="difficulty">
          <option  value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="form-group">
        <label>number of questions</label>
        <select class="box" id="amount">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
        </select>
      </div>
   
     <button id="start-btn">Start Quiz</button>

    </div>

    <!-- question screen -->

    <div class="question-screen" id="question-screen" style="display:none">
    
    <div class="progress">
        <span id="question-count">Question 1 of 10</span>
        <span  id="timer">15s</span>
    </div>

    <div class="progress-bar">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
    </div>

    <h2 id="question-text">Question goes here</h2>

    <div id="options-container"></div>

    </div>
 
    <script src="script.js"></script>

  </body>
</html>
